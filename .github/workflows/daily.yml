name: daily-pipeline

# Daily BIST sentiment run in the cloud. State (the SQLite DB) lives on an
# orphan `data` branch: each run restores it, runs the pipeline, and force-
# pushes the updated DB back as a single snapshot (no history bloat).
#
# SINGLE WRITER: once this is confirmed working, disable the local Windows
# Task Scheduler job — otherwise the laptop and the cloud both mutate the DB
# and diverge.

on:
  schedule:
    - cron: "30 6 * * 1-5"     # 06:30 UTC ≈ 09:30 Istanbul, Mon–Fri (pre-open)
  workflow_dispatch:            # manual "Run workflow" button for testing
    inputs:
      publish_chart:
        description: "Refresh docs/sample_output.png and commit it to main"
        type: boolean
        default: true
      run_validation:
        description: "Execute the frozen walk-forward protocol and store the run"
        type: boolean
        default: false
      backfill_history:
        description: "Extend market-factor and BIST history (never overwrites)"
        type: boolean
        default: false
      freeze_artifacts:
        description: "Seal the completed study and redraw the review sample"
        type: boolean
        default: false

permissions:
  contents: write               # default GITHUB_TOKEN may push the data branch

concurrency:
  # SHARED with after_close_prices.yml. Both jobs write the same SQLite file
  # and force-push the same branch, so they must queue rather than overlap.
  group: bist-database-writer
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo (main)
        uses: actions/checkout@v4

      - name: Restore DB from data branch
        run: |
          if git fetch origin data 2>/dev/null; then
            git checkout origin/data -- finance_sentiment.db \
              && echo "Restored DB from data branch." \
              || echo "data branch has no DB file yet — starting fresh."
          else
            echo "data branch does not exist yet — starting fresh."
          fi

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"
          cache: pip

      - name: Install slim deps (no torch — LLM backend)
        run: pip install -r requirements-cloud.txt

      # Before the pipeline, so the rebuild that follows sees the longer
      # history. Existing dates are never overwritten, so this cannot rewrite a
      # bar a live run collected -- including a corrected one.
      - name: Extend market history
        if: github.event_name == 'workflow_dispatch' && inputs.backfill_history
        run: python -m scripts.backfill_market_history --db finance_sentiment.db

      - name: Run pipeline
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          SENTIMENT_BACKEND: llm
        run: python main.py run --no-show

      # Sealing is idempotent by content hash, so a repeat dispatch proves
      # identity rather than creating a second record. No key is exposed: this
      # reads stored tables and writes append-only rows.
      - name: Seal the completed study and redraw the review sample
        if: github.event_name == 'workflow_dispatch' && inputs.freeze_artifacts
        run: |
          python -m scripts.freeze_result --db finance_sentiment.db
          python -m scripts.event_review_sample --db finance_sentiment.db \
            --out docs/event_review_sheet.csv

      # Readiness only: sessions accumulated, coverage, missingness. This step
      # is structurally incapable of reporting an accuracy -- database.record_
      # future_readiness rejects any report carrying one -- so watching it every
      # day cannot become optional-stopping on the untouched sample.
      #
      # continue-on-error because future validation must never be able to break
      # ordinary data collection. A missed readiness snapshot costs a row in a
      # reporting table; a failed run costs a day of headlines.
      - name: Record untouched-future readiness
        continue-on-error: true
        run: python -m scripts.future_readiness --db finance_sentiment.db

      # Opt-in, not daily. The protocol is frozen: re-running it every morning
      # would accumulate near-identical studies and invite reading the sequence
      # of verdicts as evidence. It is worth re-running when the corpus has
      # grown enough to change what the sample gate permits.
      #
      # No key is exposed: this reads stored tables and fits regularised linear
      # models. It cannot scrape, score, or alter a headline, label, category or
      # experiment identity.
      - name: Run the frozen walk-forward protocol
        if: github.event_name == 'workflow_dispatch' && inputs.run_validation
        run: python -m scripts.run_validation --db finance_sentiment.db

      # Scheduled runs always publish. Only a manual dispatch can opt out, so a
      # rehearsal run can exercise the pipeline without committing a refreshed
      # figure. The event check comes first because the inputs context is empty
      # on a schedule, where an empty value would otherwise read as false.
      - name: Publish latest chart to README
        if: github.event_name != 'workflow_dispatch' || inputs.publish_chart
        run: |
          cp sentiment_vs_bist100.png docs/sample_output.png
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add docs/sample_output.png
          if git diff --cached --quiet; then
            echo "README chart is already current."
          else
            git commit -m "Update README chart"
            git push origin HEAD:main
          fi

      # The next step force-pushes an orphan commit, so a stale database would
      # overwrite newer production state with no history to recover from.
      # Refuse the push instead of discovering the loss later.
      - name: Guard against publishing a stale snapshot
        run: |
          git fetch origin data:refs/remotes/origin/data || true
          python -m scripts.guard_db_snapshot finance_sentiment.db \
            --reference-git origin/data

      - name: Persist DB + chart to data branch
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git checkout --orphan data-snapshot
          git rm -rf --cached . >/dev/null 2>&1 || true
          git add -f finance_sentiment.db sentiment_vs_bist100.png
          git commit -m "data snapshot $(date -u +%Y-%m-%dT%H:%MZ)"
          git push -f origin data-snapshot:data

      # Deliberately the last step, and deliberately allowed to fail the run.
      #
      # It re-hashes the frozen study, checks its conclusion is still verbatim,
      # and compares the stored artifact against the copy committed to main. A
      # mismatch means a sealed result changed, which is the one thing this
      # project must never do quietly -- so it is loud.
      #
      # It runs *after* publishing on purpose. Blocking the persist step would
      # trade a day of headlines, which roll off the feeds and cannot be
      # recollected, for a check that is equally informative a minute later.
      #
      # The orphan checkout above empties the index but leaves every file on
      # disk, so the scripts and the committed artifacts are still readable
      # here without restoring anything.
      - name: Verify frozen artifacts are unchanged
        run: python -m scripts.freeze_result --db finance_sentiment.db --verify-only
